name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Signed APK and release notes
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out llama.cpp at the pinned commit
        run: git submodule update --init --depth 1

      - name: Check the tag
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::$tag is not X.Y.Z"; exit 1; }
          # versionCode is major*10000 + minor*100 + patch, so minor and patch get two digits.
          (( BASH_REMATCH[2] < 100 && BASH_REMATCH[3] < 100 )) \
            || { echo "::error::minor and patch must stay below 100 to keep versionCode monotonic"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$tag is not on main"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the NDK and CMake the build pins
        run: |
          ndk=$(sed -n 's/^android-ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "cmake;3.22.1" > /dev/null

      - name: Build the signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ILOTOKI_KEYSTORE_BASE64 }}
          ILOTOKI_KEYSTORE_PASSWORD: ${{ secrets.ILOTOKI_KEYSTORE_PASSWORD }}
          ILOTOKI_KEY_ALIAS: ${{ secrets.ILOTOKI_KEY_ALIAS }}
          ILOTOKI_KEY_PASSWORD: ${{ secrets.ILOTOKI_KEY_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::the ILOTOKI_KEYSTORE_BASE64 secret is not set"; exit 1; }
          export ILOTOKI_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          base64 --decode <<< "$KEYSTORE_BASE64" > "$ILOTOKI_KEYSTORE_FILE"
          ./gradlew :composeApp:assembleRelease
          rm -f "$ILOTOKI_KEYSTORE_FILE"

      - name: Check what was built
        run: |
          apk=composeApp/build/outputs/apk/release/composeApp-release.apk
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" | head -3
          badging="$("$tools/aapt2" dump badging "$apk" | head -1)"
          echo "$badging"
          # The version comes from `git describe`; on the tagged commit it must be the tag, exactly.
          grep -q "versionName='$GITHUB_REF_NAME'" <<< "$badging" \
            || { echo "::error::the APK is not versioned $GITHUB_REF_NAME"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/ilo-toki-$GITHUB_REF_NAME.apk"
          (cd dist && sha256sum "ilo-toki-$GITHUB_REF_NAME.apk" > "ilo-toki-$GITHUB_REF_NAME.apk.sha256")

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ilo toki $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
